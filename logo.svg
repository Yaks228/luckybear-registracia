<!-- SVG Logo for Lucky Bear Casino -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the bear -->
    <linearGradient id="bearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the coin -->
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1a1a1a" stroke="#3b82f6" stroke-width="4"/>
  
  <!-- Bear head -->
  <ellipse cx="100" cy="100" rx="45" ry="40" fill="url(#bearGradient)" filter="url(#dropShadow)"/>
  
  <!-- Bear ears -->
  <ellipse cx="70" cy="70" rx="15" ry="20" fill="url(#bearGradient)" transform="rotate(-30 70 70)"/>
  <ellipse cx="130" cy="70" rx="15" ry="20" fill="url(#bearGradient)" transform="rotate(30 130 70)"/>
  
  <!-- Inner ears -->
  <ellipse cx="72" cy="72" rx="8" ry="12" fill="#1e40af" transform="rotate(-30 72 72)"/>
  <ellipse cx="128" cy="72" rx="8" ry="12" fill="#1e40af" transform="rotate(30 128 72)"/>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="90" rx="6" ry="8" fill="#ffffff"/>
  <ellipse cx="115" cy="90" rx="6" ry="8" fill="#ffffff"/>
  <ellipse cx="85" cy="90" rx="3" ry="4" fill="#1a1a1a"/>
  <ellipse cx="115" cy="90" rx="3" ry="4" fill="#1a1a1a"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="105" rx="4" ry="3" fill="#1a1a1a"/>
  
  <!-- Mouth -->
  <path d="M 100 105 Q 95 110 90 105" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M 100 105 Q 105 110 110 105" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  
  <!-- Lucky coin -->
  <circle cx="140" cy="140" r="18" fill="url(#coinGradient)" filter="url(#dropShadow)"/>
  <text x="140" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">₽</text>
  
  <!-- Casino chips -->
  <circle cx="60" cy="140" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <circle cx="60" cy="140" r="6" fill="none" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Sparkles -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="40" cy="40" r="2"/>
    <circle cx="160" cy="50" r="1.5"/>
    <circle cx="170" cy="120" r="1"/>
    <circle cx="30" cy="130" r="1.5"/>
    <circle cx="160" cy="160" r="1"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="185" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">LUCKY BEAR</text>
</svg>